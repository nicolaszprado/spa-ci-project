name: Application Health Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["CI and Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: Health check
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      MONITOR_URL: ${{ vars.MONITOR_URL || 'https://nicolaszprado.github.io/spa-ci-project/' }}

    steps:
      - name: Check public application
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -u
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --location --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 --output "$RESPONSE_FILE" --write-out "%{http_code}" "$MONITOR_URL" || true)"

          echo "URL: $MONITOR_URL"
          echo "HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]] && grep -q "Rei da Catira | Classificados de carros" "$RESPONSE_FILE"; then
            echo "Status: AVAILABLE"
            echo "The application returned a successful HTTP status and the expected page title." >> "$GITHUB_STEP_SUMMARY"
            echo "- URL: $MONITOR_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "- HTTP status: $HTTP_CODE" >> "$GITHUB_STEP_SUMMARY"
            echo "- Content check: passed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Status: UNAVAILABLE"
          echo "The application did not pass the HTTP or content health check." >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $MONITOR_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP status: ${HTTP_CODE:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Content check: failed" >> "$GITHUB_STEP_SUMMARY"
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Create GitHub issue for persistent failure
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          EXISTING_ISSUE="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title [Monitoramento] Aplicação indisponível" --json number --jq 'length')"

          if [[ "$EXISTING_ISSUE" == "0" ]]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "[Monitoramento] Aplicação indisponível" \
              --body "O health check da aplicação falhou após as tentativas configuradas.

          - URL: $MONITOR_URL
          - HTTP status: ${{ steps.health.outputs.http_code || 'none' }}
          - Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Verifique o workflow **Application Health Check** e o deployment no GitHub Pages."
          else
            echo "Uma issue aberta já registra esta indisponibilidade."
          fi

      - name: Fail monitoring run when unavailable
        if: steps.health.outcome == 'failure'
        run: |
          echo "Health check failed after retries."
          exit 1
